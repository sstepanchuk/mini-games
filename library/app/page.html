<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<!-- What may run here, and in a game's srcdoc frame, which inherits it (README: Trust): scripts of the site and inline
     ones, and the pinned MQTT client (library/net/config.js MQTT_LIB: tests/trust.test.js keeps the two the same);
     workers of the site or from blob: (the MQTT client's timers run in one); no eval, plugins or a <base> elsewhere.
     blob: in script-src too: Safari before 15.5 (older iPhones) knows no worker-src and judges a worker by script-src,
     so without it the timers' worker is refused there and the internet room loses its keepalive. It lets in nothing
     new: a blob: script is made by code already running here, which may run inline code anyway. -->
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' blob: https://cdn.jsdelivr.net/npm/mqtt@5.16.0/dist/mqtt.min.js https://unpkg.com/mqtt@5.16.0/dist/mqtt.min.js; worker-src 'self' blob:; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="{{theme}}">
<meta name="robots" content="noindex">
{{?version}}<meta name="ihroteka-version" content="{{version}}">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<!-- Link preview for Telegram and other messengers. The library is public; the games themselves are encrypted. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ігротека">
<meta property="og:locale" content="uk_UA">
<meta property="og:title" content="{{shareTitle}}">
<meta property="og:description" content="{{shareDescription}}">
{{?imageUrl}}<meta property="og:image" content="{{imageUrl}}">
{{?imageUrl}}<meta property="og:image:type" content="image/png">
{{?imageUrl}}<meta property="og:image:width" content="1200">
{{?imageUrl}}<meta property="og:image:height" content="630">
{{?imageUrl}}<meta property="og:image:alt" content="{{imageAlt}}">
{{?imageUrl}}<meta name="twitter:card" content="summary_large_image">
{{?imageUrl}}<meta name="twitter:image" content="{{imageUrl}}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>{{emoji}}</text></svg>">
<link rel="manifest" href="{{base}}manifest.webmanifest">
<link rel="apple-touch-icon" href="{{base}}icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Ігротека">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Unbounded:wght@500;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="{{base}}lib/ihroteka.css">
<link rel="modulepreload" href="{{base}}lib/ihroteka.js">
</head>
<body>
<!-- #busy: «Відкриваю Ігротеку…» as the page starts; or why the library did not open, with «Спробувати ще» under it
     (ihrotekaStuck below; index.js stuck). The stage: the open game's frame, under a note while it opens or when it did
     not («Спробувати ще» / «Ввести пароль»: shell.js) or broke («Скопіювати звіт»). -->
<p class="busy" id="busy">Відкриваю Ігротеку…</p>
<noscript><p class="err">Без JavaScript бібліотека не відкриється.</p></noscript>

<section class="shelf" id="shelf" hidden>
  <div class="shelf-head">
    <h1 class="title">Ігротека</h1>
    <button class="chip" id="together" type="button">Грати разом</button>
  </div>
  <div class="games" id="games"></div>
  <p class="fine" id="install" hidden></p>
  <button class="btn ghost" id="sign-out" type="button" hidden>Забути пароль на цьому пристрої</button>
  <p class="fine err" id="sign-out-err" role="alert"></p>
</section>

<section class="stage" id="stage" hidden>
  <div class="stage-note" id="stage-note"><p id="stage-text"></p><button class="btn" id="stage-report" type="button" hidden>Скопіювати звіт</button><button class="btn" id="stage-retry" type="button" hidden>Спробувати ще</button><button class="btn ghost" id="stage-back" type="button">До бібліотеки</button></div>
</section>
<div id="layer"></div>

<script>
  // The library is a module: if it does not come (the network failed) or this browser cannot run it, say so instead of
  // spinning forever (no spinner; told to a screen reader); retry: a «Спробувати ще» that loads the page again. Not once
  // the library started (it says the rest itself: index.js), nor over what was said already.
  function ihrotekaStuck(text, retry) {
    var b = document.getElementById('busy');
    if (window.__ihrotekaBooted || !b || b.className !== 'busy') return;
    b.className = 'err';
    b.setAttribute('role', 'alert');
    b.textContent = text;
    if (!retry) return;
    var r = document.createElement('button');
    r.className = 'btn'; r.type = 'button'; r.id = 'busy-retry'; r.textContent = 'Спробувати ще';
    r.onclick = function () { location.reload(); };
    b.parentNode.insertBefore(r, b.nextSibling);
    r.focus();
  }
  setTimeout(function () { ihrotekaStuck('Цей браузер застарий для бібліотеки. Онови його або відкрий в іншому.'); }, 8000);
</script>
<script type="module" onerror="ihrotekaStuck('Не вдалося завантажити. Перевір інтернет і спробуй ще.', true)">
  import { boot } from '{{base}}lib/ihroteka.js';
  boot({{bootArgs}});
</script>
</body>
</html>
