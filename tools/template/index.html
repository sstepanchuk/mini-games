<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eee7d7">
<title>{{title}}</title>
<!-- шрифти бібліотеки (Oswald, Inter Tight) не затримують перший показ: поки вони вантажаться (чи без інтернету), видно
     системний шрифт; у бібліотеці гру видно, коли вони вже є -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<!-- збірка вбудовує стилі й модулі в одну сторінку (README, «Adding a game») -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <button class="home" id="home" type="button" hidden>← Усі ігри</button>
  <h1>{{title}}</h1>
  <section id="lobby">
    <p id="lobby-text"></p>
    <div class="row">
      <button class="btn" id="start" type="button">Почати</button>
      <button id="invite" type="button" hidden>Запросити друзів</button>
    </div>
  </section>
  <section id="play" hidden>
    <p class="total"><b id="total">0</b> з <span id="target"></span></p>
    <ol id="seats" aria-label="Гравці"></ol>
    <div id="steps" class="steps" role="group" aria-label="Додати"></div>
    <!-- «Ще раз» і «Вийти з раунду» — в одному рядку сталої висоти: коли одна змінює іншу, нічого під ними не зсувається -->
    <div class="row actions">
      <button class="btn" id="again" type="button" hidden>Ще раз</button>
      <button class="ghost" id="quit" type="button" hidden>Вийти з раунду</button>
    </div>
  </section>
  <!-- рядок стану — він же живий регіон: читач екрана чує в ньому й хід, якого не бачить (#said, «Богдан: +2 — 7 з
       10.»), а тоді те, що видно (#say-text, «Твій хід») -->
  <p id="say" role="status" aria-live="polite"><span class="sr" id="said"></span><span id="say-text"></span></p>
  <!-- екран очікування бібліотеки (README, «Waiting screens»): на кого чекаємо й чому, місце, інша версія. Лиши його
       порожнім: заповнює бібліотека. Тут, у кінці, під кнопками, його видно і в лобі, і в раунді, а коли він
       з'являється чи зникає, над ним нічого не зсувається (сторінка стоїть угорі); на низькому екрані, де його не
       видно, те саме каже картка бібліотеки над грою -->
  <ihroteka-wait></ihroteka-wait>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
