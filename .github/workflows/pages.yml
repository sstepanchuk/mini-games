name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every action is pinned to a commit: a tag can be moved, a commit cannot (anything that runs here could reach
# the site, and the site holds people's keys). To update one: git ls-remote --tags https://github.com/actions/<name>

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    # (npm test alone takes about 4.5 minutes: three files at a time, mostly waiting on timers)
    timeout-minutes: 10
    steps:
      # the whole history: the mixed-version tests take the previous release from it (tests/support/release.js)
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No plaintext game sources in git
        run: |
          if git ls-files --error-unmatch games >/dev/null 2>&1; then
            echo "::error::games/ must never be committed (plaintext sources)"; exit 1
          fi
      # Generated passwords look like ####-####-#### (tools/repo.js: makePassword). Only names and counts are
      # printed (the log is public); binary files are skipped (a PNG's metadata can hold such a group by chance).
      - name: No passwords in git
        run: |
          if LC_ALL=C git grep -cIE '(^|[^A-Za-z0-9_])[a-hjkmnp-z2-9]{4}-[a-hjkmnp-z2-9]{4}-[a-hjkmnp-z2-9]{4}([^A-Za-z0-9_]|$)'; then
            echo "::error::these files hold something shaped like a password: remove it, and if it is a real one, change it (npm run user -- passwd)"; exit 1
          fi
      - run: npm run lint
      # (a shallow or missing history fails the mixed-version tests here, rather than skipping them)
      - run: npm test
        env:
          IHROTEKA_NEED_PREVIOUS: '1'
      - run: npm run check
      - name: Assemble the site from library/ and vault/
        run: npm run site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    name: Deploy
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
